services:
  - type: web
    name: next-level-commerce-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npm run build && npm run db:push && npm run db:seed
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
